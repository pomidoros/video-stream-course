name: Homework checks
on:
  push:
    paths:
      - 'homework/**'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - 'homework/**'
      - '.github/workflows/checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: homework/final_project
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: homework/final_project/requirements.txt
      - name: Download course data
        env:
          COURSE_DATA_URL: ${{ vars.COURSE_DATA_URL }}
        run: python scripts/setup_data.py
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps deep-sort-realtime==1.3.2
      - name: Provided data and environment
        run: python scripts/check.py environment
      - name: Your implementations
        run: python scripts/check.py contracts
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: homework/final_project
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: homework/final_project/requirements.txt
      - name: Download course data
        env:
          COURSE_DATA_URL: ${{ vars.COURSE_DATA_URL }}
        run: python scripts/setup_data.py
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps deep-sort-realtime==1.3.2
      - name: Video exercise
        run: python -m project video --output outputs
      - name: Fresh CPU training
        run: python -m project train --models artifacts
      - name: Published metric thresholds
        run: python scripts/check.py metrics --models artifacts
